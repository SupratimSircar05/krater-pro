<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="asset-title asset-description">
  <title id="asset-title">Krater Pro Product Hunt thumbnail</title>
  <desc id="asset-description">The canonical Krater Pro crater mark on a dark orange-glow tile.</desc>
  <defs>
    <radialGradient id="thumb-glow" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#6B2B1D"/>
      <stop offset=".46" stop-color="#24110E"/>
      <stop offset="1" stop-color="#08090B"/>
    </radialGradient>
    <linearGradient id="thumb-edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF9461" stop-opacity=".58"/>
      <stop offset=".48" stop-color="#E87A46" stop-opacity=".18"/>
      <stop offset="1" stop-color="#F2F0EC" stop-opacity=".08"/>
    </linearGradient>
    <filter id="thumb-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#000000" flood-opacity=".62"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="44" fill="url(#thumb-glow)"/>
  <rect x="1.5" y="1.5" width="237" height="237" rx="42.5" fill="none" stroke="url(#thumb-edge)" stroke-width="3"/>
  <circle cx="120" cy="95" r="77" fill="#E87A46" opacity=".08"/>

  <!-- Canonical mark copied from web/src/assets/krater-pro-mark.svg. -->
  <svg x="54" y="28" width="132" height="132" viewBox="0 0 64 64" role="img" aria-labelledby="mark-title mark-description">
    <title id="mark-title">Krater Pro</title>
    <desc id="mark-description">An illuminated orange crater surrounded by an orbital ring.</desc>
    <defs>
      <linearGradient id="tile" x1="9" y1="5" x2="55" y2="59" gradientUnits="userSpaceOnUse">
        <stop stop-color="#3A1710"/>
        <stop offset=".62" stop-color="#140D0C"/>
        <stop offset="1" stop-color="#0B0C0F"/>
      </linearGradient>
      <radialGradient id="crater" cx="0" cy="0" r="1" gradientTransform="translate(26 24) rotate(49) scale(27)">
        <stop stop-color="#FFB083"/>
        <stop offset=".38" stop-color="#F08750"/>
        <stop offset=".72" stop-color="#B94B2D"/>
        <stop offset="1" stop-color="#572219"/>
      </radialGradient>
      <radialGradient id="basin" cx="0" cy="0" r="1" gradientTransform="translate(37 38) rotate(132) scale(12)">
        <stop stop-color="#351411"/>
        <stop offset=".68" stop-color="#6B291D"/>
        <stop offset="1" stop-color="#D6653C"/>
      </radialGradient>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="2.4"/>
      </filter>
    </defs>
    <rect x="1" y="1" width="62" height="62" rx="18" fill="url(#tile)"/>
    <rect x="1.5" y="1.5" width="61" height="61" rx="17.5" fill="none" stroke="#FF9D69" stroke-opacity=".34"/>
    <ellipse cx="32" cy="34" rx="25" ry="10" transform="rotate(-20 32 34)" fill="none" stroke="#FFC19D" stroke-opacity=".32" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="19" fill="#E66D3D" fill-opacity=".22" filter="url(#glow)"/>
    <circle cx="32" cy="32" r="17" fill="url(#crater)"/>
    <circle cx="37" cy="38" r="7.5" fill="url(#basin)"/>
    <circle cx="25" cy="25" r="3.5" fill="#7D3021" fill-opacity=".65"/>
    <circle cx="23.5" cy="23.5" r="1.2" fill="#FFD1B4" fill-opacity=".56"/>
    <path d="M19.5 30.5c2.8-7.7 9.7-12.2 17.4-11.8" fill="none" stroke="#FFD0B1" stroke-linecap="round" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="50.5" cy="26" r="2.2" fill="#FFC29D"/>
    <circle cx="12.5" cy="40.5" r="1.4" fill="#FF9A63" fill-opacity=".75"/>
  </svg>

  <text x="120" y="190" text-anchor="middle" fill="#F2F0EC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" letter-spacing="-1">KRATER PRO</text>
  <text x="120" y="215" text-anchor="middle" fill="#FF9461" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2">AGENTIC CODING</text>
</svg>
