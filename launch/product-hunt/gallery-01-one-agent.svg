<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="760" viewBox="0 0 1270 760" role="img" aria-labelledby="asset-title asset-description">
  <title id="asset-title">Krater Pro — one agent across CLI and IDE</title>
  <desc id="asset-description">A dark orange Krater Pro launch graphic showing a local command-line coding agent and an integrated browser IDE.</desc>
  <defs>
    <linearGradient id="bg-one" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#150D0C"/>
      <stop offset=".46" stop-color="#08090B"/>
      <stop offset="1" stop-color="#0D0F13"/>
    </linearGradient>
    <radialGradient id="halo-one" cx="0" cy="0" r="1" gradientTransform="translate(190 180) rotate(24) scale(480 410)">
      <stop stop-color="#E87A46" stop-opacity=".18"/>
      <stop offset=".62" stop-color="#E87A46" stop-opacity=".03"/>
      <stop offset="1" stop-color="#E87A46" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel-one" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17191E"/>
      <stop offset="1" stop-color="#0C0E12"/>
    </linearGradient>
    <linearGradient id="orange-line-one" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF9461"/>
      <stop offset="1" stop-color="#E87A46" stop-opacity=".16"/>
    </linearGradient>
    <filter id="panel-shadow-one" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity=".55"/>
    </filter>
    <clipPath id="workbench-clip-one">
      <rect x="566" y="94" width="634" height="574" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1270" height="760" fill="url(#bg-one)"/>
  <rect width="1270" height="760" fill="url(#halo-one)"/>
  <path d="M0 679C295 596 455 711 713 655c206-45 365-125 557-99v204H0Z" fill="#E87A46" opacity=".025"/>
  <circle cx="1190" cy="94" r="180" fill="#E87A46" opacity=".025"/>

  <!-- Canonical mark copied from web/src/assets/krater-pro-mark.svg. -->
  <svg x="70" y="54" width="68" height="68" viewBox="0 0 64 64" role="img" aria-labelledby="mark-title-one mark-description-one">
    <title id="mark-title-one">Krater Pro</title>
    <desc id="mark-description-one">An illuminated orange crater surrounded by an orbital ring.</desc>
    <defs>
      <linearGradient id="tile" x1="9" y1="5" x2="55" y2="59" gradientUnits="userSpaceOnUse">
        <stop stop-color="#3A1710"/>
        <stop offset=".62" stop-color="#140D0C"/>
        <stop offset="1" stop-color="#0B0C0F"/>
      </linearGradient>
      <radialGradient id="crater" cx="0" cy="0" r="1" gradientTransform="translate(26 24) rotate(49) scale(27)">
