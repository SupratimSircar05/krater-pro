  <text x="156" y="84" fill="#F2F0EC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="800" letter-spacing="-.7">KRATER PRO</text>
  <text x="156" y="109" fill="#A7A5A0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" letter-spacing="1.6">AGENTIC CODING WORKSPACE</text>

  <rect x="70" y="157" width="182" height="32" rx="16" fill="#E87A46" fill-opacity=".12" stroke="#E87A46" stroke-opacity=".38"/>
  <circle cx="91" cy="173" r="5" fill="#FF9461"/>
  <text x="106" y="179" fill="#FFC29D" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">LOCAL-FIRST · BYOK</text>

  <text x="70" y="258" fill="#F2F0EC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="58" font-weight="780" letter-spacing="-2.4">
    <tspan x="70" dy="0">One agent.</tspan>
    <tspan x="70" dy="67">Terminal + IDE.</tspan>
  </text>
  <text x="70" y="426" fill="#B8B5AF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="440">
    <tspan x="70" dy="0">Keep the conversation, project, approvals,</tspan>
    <tspan x="70" dy="32">and model decision coherent as you work.</tspan>
  </text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="620">
