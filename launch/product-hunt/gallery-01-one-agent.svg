      <text x="585" y="253">⌄  src</text>
      <text x="603" y="280" fill="#FFB083">◇  agent.ts</text>
      <text x="603" y="307">◇  router.ts</text>
      <text x="603" y="334">◇  tools.ts</text>
      <text x="585" y="368">⌄  web</text>
