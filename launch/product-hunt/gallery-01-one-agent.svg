  <text x="1200" y="710" text-anchor="end" fill="#85827D" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Local CLI · Browser IDE · Your Krater API key</text>
