  <rect x="566" y="94" width="634" height="5" rx="2.5" fill="url(#orange-line-one)"/>

  <text x="70" y="710" fill="#85827D" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Built by</text>
