    <rect x="1104" y="395" width="52" height="27" rx="7" fill="#1A1C21" stroke="#3A3D45"/>
    <text x="1130" y="413" text-anchor="middle" fill="#D4D1CC" font-size="10" font-weight="700">DENY</text>
    <rect x="1028" y="459" width="155" height="37" rx="9" fill="#15171C" stroke="#2D3037"/>
    <text x="1042" y="482" fill="#A9ABB1" font-size="10.5">1,295 in · 45 out</text>
    <rect x="1028" y="603" width="155" height="45" rx="10" fill="#191B20" stroke="#343740"/>
    <text x="1042" y="630" fill="#7F828A" font-size="11">Ask Krater…</text>
