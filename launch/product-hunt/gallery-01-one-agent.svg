    <text x="839" y="184" fill="#747780" font-size="12">×</text>

    <rect x="715" y="199" width="296" height="302" fill="#111318"/>
    <g font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12.5">
      <g fill="#545861" text-anchor="end">
        <text x="746" y="232">18</text>
        <text x="746" y="258">19</text>
        <text x="746" y="284">20</text>
        <text x="746" y="310">21</text>
        <text x="746" y="336">22</text>
        <text x="746" y="362">23</text>
        <text x="746" y="388">24</text>
        <text x="746" y="414">25</text>
      </g>
      <text x="765" y="232" fill="#C792EA">export async function</text>
      <text x="932" y="232" fill="#82AAFF">runTask</text>
      <text x="765" y="258" fill="#E5E2DD">(session, task) {</text>
      <text x="785" y="284" fill="#C792EA">const</text>
      <text x="829" y="284" fill="#E5E2DD">route =</text>
      <text x="902" y="284" fill="#82AAFF">await</text>
      <text x="785" y="310" fill="#82AAFF">selectModel</text>
      <text x="883" y="310" fill="#E5E2DD">(task);</text>
      <text x="785" y="336" fill="#C792EA">return</text>
      <text x="843" y="336" fill="#82AAFF">agent</text>
      <text x="883" y="336" fill="#E5E2DD">.run({</text>
      <text x="805" y="362" fill="#F78C6C">workspace</text>
      <text x="890" y="362" fill="#E5E2DD">, route,</text>
      <text x="805" y="388" fill="#F78C6C">approval</text>
      <text x="886" y="388" fill="#E5E2DD">:</text>
      <text x="901" y="388" fill="#C3E88D">"ask"</text>
      <text x="785" y="414" fill="#E5E2DD">});</text>
      <text x="765" y="440" fill="#E5E2DD">}</text>
    </g>

    <rect x="715" y="501" width="296" height="167" fill="#0C0E12"/>
    <rect x="715" y="501" width="296" height="38" fill="#111318"/>
    <text x="733" y="525" fill="#FFB083" font-size="11" font-weight="750" letter-spacing="1.2">TERMINAL</text>
    <text x="816" y="525" fill="#747780" font-size="11" font-weight="650">SOURCE CONTROL</text>
    <rect x="730" y="554" width="266" height="96" rx="8" fill="#080A0D" stroke="#24272E"/>
