appId: com.supratimsircar.kraterpro
productName: Krater Pro
copyright: Copyright © 2026 Supratim Sircar

directories:
  output: release
  buildResources: desktop/assets

files:
  - dist/**/*
  - web/dist/**/*
  - desktop/bootstrap.mjs
  - desktop/command-gate-parent.mjs
  - desktop/main.mjs
  - desktop/runtime.mjs
  - desktop/window-security.mjs
  - desktop/assets/icon.png
  - package.json
  - LICENSE

extraMetadata:
  main: desktop/bootstrap.mjs
  desktopName: krater-pro

asar: true
compression: maximum
npmRebuild: false
afterPack: desktop/scripts/after-pack.mjs

electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

mac:
  category: public.app-category.developer-tools
  icon: icon.icns
  hardenedRuntime: true
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.inherit.plist
  darkModeSupport: true
  artifactName: Krater-Pro-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  extendInfo:
    NSHumanReadableCopyright: Built by Supratim with ❤️
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
      NSAllowsLocalNetworking: true
      NSExceptionDomains:
        "127.0.0.1":
          NSIncludesSubdomains: false
          NSTemporaryExceptionAllowsInsecureHTTPLoads: true
        localhost:
          NSIncludesSubdomains: false
          NSTemporaryExceptionAllowsInsecureHTTPLoads: true

dmg:
  title: Krater Pro ${version}
  writeUpdateInfo: false

linux:
  icon: icon.png
  executableName: krater-pro
  maintainer: Supratim Sircar <supratimsircar@users.noreply.github.com>
  vendor: Supratim Sircar
  syncDesktopName: true
  category: Development
  synopsis: Agentic coding IDE powered by the Krater API
  description: Krater Pro is a local, approval-aware agentic coding IDE and CLI.
  artifactName: Krater-Pro-${version}-${arch}.${ext}
  target:
    - AppImage
    - deb

deb:
  priority: optional
