name: Windows DPAPI diagnostic

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
      - name: Compare fixed DPAPI launch contexts
        run: node .github/scripts/windows-dpapi-diagnostic.mjs
