name: Verified native release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_VERSION: 11.16.0
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  validate:
    name: Validate source and release contract
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Pin npm used for release inputs
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - run: npm ci
      - run: npm run guard:secrets
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run desktop:test
      - run: npm run cloud:test
      - run: npm run benchmark:evidence:validate
      - run: npm run benchmark:evidence:smoke
      - name: Verify release tag
        if: github.event_name == 'push'
        run: node desktop/scripts/verify-release-tag.mjs
      - name: Read package version
        id: manifest
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release-authorization:
    name: Verify protected release capabilities
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-22.04
    environment: production-release
    env:
      HAS_MAC_SIGNING: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
      HAS_DETACHED_SIGNING: ${{ secrets.RELEASE_GPG_PRIVATE_KEY_BASE64 != '' && secrets.RELEASE_GPG_KEY_ID != '' && secrets.RELEASE_GPG_PASSPHRASE != '' }}
      HAS_TAP_MAINTENANCE: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Fail closed when a stable-release capability is absent
        shell: bash
        run: |
          for capability in \
            HAS_MAC_SIGNING \
            HAS_APPLE_NOTARY \
            HAS_WINDOWS_SIGNING \
            HAS_DETACHED_SIGNING \
            HAS_TAP_MAINTENANCE
          do
            if [ "${!capability}" != "true" ]; then
              echo "::error::Stable release capability is not configured: $capability"
              exit 1
            fi
          done

  cli:
    name: Reproducible CLI archive
    needs:
      - validate
      - release-authorization
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (github.event_name != 'push' || needs.release-authorization.result == 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - run: npm ci
      - run: npm run build
      - name: Fix source timestamp to the release commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build twice and compare immutable CLI archive bytes
        run: npm run release:cli
      - name: Attest CLI archive and dependency SBOM
        if: github.event_name == 'push'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release/cli/krater-pro-cli-${{ needs.validate.outputs.version }}.tgz
          sbom-path: release/cli/krater-pro-cli-${{ needs.validate.outputs.version }}.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krater-pro-cli
          path: release/cli/*
          if-no-files-found: error
          compression-level: 0

  desktop:
    name: ${{ matrix.label }}
    needs:
      - validate
      - release-authorization
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (github.event_name != 'push' || needs.release-authorization.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            os: macos-15
            platform: mac
            script: desktop:dist:mac
            args: --arm64
            artifact: krater-pro-macos-arm64
            sbom: krater-pro-desktop-macos-arm64.spdx.json
            subjects: |
              release/*.dmg
              release/*.zip
            paths: |
              release/*.dmg
              release/*.zip
              release/*.spdx.json
          - label: macOS Intel
            os: macos-15-intel
            platform: mac
            script: desktop:dist:mac
            args: --x64
            artifact: krater-pro-macos-x64
            sbom: krater-pro-desktop-macos-x64.spdx.json
            subjects: |
              release/*.dmg
              release/*.zip
            paths: |
              release/*.dmg
              release/*.zip
              release/*.spdx.json
          - label: Windows x64
            os: windows-2022
            platform: win
            script: desktop:dist:win
            args: --x64
            artifact: krater-pro-windows-x64
            sbom: krater-pro-desktop-windows-x64.spdx.json
            subjects: release/*.exe
            paths: |
              release/*.exe
              release/*.spdx.json
          - label: Linux x64
            os: ubuntu-22.04
            platform: linux
            script: desktop:dist:linux
            args: --x64
            artifact: krater-pro-linux-x64
            sbom: krater-pro-desktop-linux-x64.spdx.json
            subjects: |
              release/*.AppImage
              release/*.deb
            paths: |
              release/*.AppImage
              release/*.deb
              release/*.spdx.json
    runs-on: ${{ matrix.os }}
    environment:
      name: ${{ github.event_name == 'push' && 'production-release' || 'release-candidate' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      KRATER_RELEASE_MODE: ${{ github.event_name == 'push' && 'stable' || 'candidate' }}
      NODE_OPTIONS: --max-old-space-size=6144
      CSC_LINK: ${{ github.event_name == 'push' && matrix.platform == 'mac' && secrets.MAC_CSC_LINK || github.event_name == 'push' && matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || github.event_name == 'push' && matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      APPLE_API_KEY_ID: ${{ github.event_name == 'push' && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ github.event_name == 'push' && secrets.APPLE_API_ISSUER || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - run: npm ci
      - name: Exercise platform command-gate tests
        run: >-
          npm test --
          src/command-gate.test.ts
          src/credential-store.test.ts
          src/credential-store.windows-launch.test.ts
          src/windows-system-executable.test.ts
          src/workspace.command-security.test.ts
          desktop/tests/command-gate-parent.test.mjs
          --testTimeout=20000
      - name: Fix source timestamp to the release commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Select ephemeral Apple key path
        if: github.event_name == 'push' && matrix.platform == 'mac'
        shell: bash
        run: echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey_KraterPro.p8" >> "$GITHUB_ENV"
      - name: Materialize Apple notarization key without logging it
        if: github.event_name == 'push' && matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          node -e 'require("fs").writeFileSync(process.env.APPLE_API_KEY, Buffer.from(process.env.APPLE_API_KEY_P8_BASE64, "base64"), { mode: 0o600 })'
      - name: Validate platform release environment
        if: github.event_name == 'push' && matrix.platform != 'linux'
        run: node scripts/release/validate-release-environment.mjs --platform ${{ matrix.platform }} --stable
      - name: Install Linux launch-smoke display
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Build native packages
        run: npm run ${{ matrix.script }} -- ${{ matrix.args }}
      - name: Exercise the native workspace command boundary
        run: node scripts/release/smoke-workspace-command.mjs
      - name: Create deterministic dependency SBOM
        run: node scripts/release/create-sbom.mjs --profile desktop --output release/${{ matrix.sbom }}
      - name: Launch packaged application and renderer
        run: node scripts/release/smoke-built-desktop.mjs --platform ${{ matrix.platform }}
      - name: Verify macOS Developer ID and notarization
        if: github.event_name == 'push' && matrix.platform == 'mac'
        shell: bash
        run: |
          APP_PATH="$(find release -type d -name 'Krater Pro.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          for dmg in release/*.dmg; do
            xcrun stapler validate "$dmg"
          done
      - name: Verify Windows Authenticode signatures
        if: github.event_name == 'push' && matrix.platform == 'win'
        shell: pwsh
        run: |
          $releaseExecutables = @(Get-ChildItem release -File -Filter *.exe)
          if ($releaseExecutables.Count -eq 0) {
            throw "No Windows release executables were produced."
          }
          $innerExecutable = Join-Path (Join-Path "release" "win-unpacked") "KraterPro.exe"
          if (-not (Test-Path -LiteralPath $innerExecutable -PathType Leaf)) {
            throw "The shipped inner Windows executable was not produced: $innerExecutable"
          }
          $executablesToVerify = @($releaseExecutables) + @(
            Get-Item -LiteralPath $innerExecutable
          )
          $executablesToVerify | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($_.Name): $($signature.Status)"
            }
          }
      - name: Remove ephemeral notarization material
        if: always() && matrix.platform == 'mac'
        shell: bash
        run: rm -f "$APPLE_API_KEY"
      - name: Attest native artifacts with dependency SBOM
        if: github.event_name == 'push'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ matrix.subjects }}
          sbom-path: release/${{ matrix.sbom }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          compression-level: 0

  assemble:
    name: Assemble release receipt
    needs:
      - validate
      - cli
      - desktop
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.cli.result == 'success' &&
      needs.desktop.result == 'success'
    runs-on: ubuntu-22.04
    environment:
      name: ${{ github.event_name == 'push' && 'production-release' || 'release-candidate' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      KRATER_RELEASE_GPG_KEY_ID: ${{ github.event_name == 'push' && secrets.RELEASE_GPG_KEY_ID || '' }}
      KRATER_RELEASE_GPG_PASSPHRASE: ${{ github.event_name == 'push' && secrets.RELEASE_GPG_PASSPHRASE || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums and source-bound release manifest
        run: >-
          node scripts/release/create-release-manifest.mjs
          --directory release-assets
          --version "${{ needs.validate.outputs.version }}"
      - name: Import detached-signing key without persisting it
        if: github.event_name == 'push'
        shell: bash
        env:
          RELEASE_GPG_PRIVATE_KEY_BASE64: ${{ secrets.RELEASE_GPG_PRIVATE_KEY_BASE64 }}
        run: |
          KEY_FILE="$RUNNER_TEMP/krater-release-key.asc"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.RELEASE_GPG_PRIVATE_KEY_BASE64, "base64"), { mode: 0o600 })' "$KEY_FILE"
          gpg --batch --import "$KEY_FILE"
          rm -f "$KEY_FILE"
      - name: Sign and immediately verify release integrity files
        run: >-
          node scripts/release/sign-release-artifacts.mjs
          --directory release-assets
          ${{ github.event_name == 'push' && '--required' || '' }}
      - name: Attest checksum manifest
        if: github.event_name == 'push'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/SHA256SUMS.txt
      - name: Attest source-bound release manifest
        if: github.event_name == 'push'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/krater-pro-${{ needs.validate.outputs.version }}.release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krater-pro-release-bundle
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish immutable GitHub Release
    if: github.event_name == 'push'
    needs:
      - validate
      - assemble
    runs-on: ubuntu-22.04
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: krater-pro-release-bundle
          path: release-assets
      - name: Publish exact signed and attested assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Krater Pro $GITHUB_REF_NAME" \
            --generate-notes \
            release-assets/*

  homebrew:
    name: Prepare Homebrew tap update
    if: github.event_name == 'push'
    needs:
      - validate
      - publish
    runs-on: ubuntu-22.04
    environment: production-release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPOSITORY: SupratimSircar05/homebrew-tap
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
          path: krater-pro
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: SupratimSircar05/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false
          path: homebrew-tap
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: krater-pro-release-bundle
          path: release-assets
      - name: Render checksum-verified formula and cask
        run: >-
          node krater-pro/packaging/homebrew/prepare-tap.mjs
          --assets release-assets
          --output homebrew-tap
          --version "${{ needs.validate.outputs.version }}"
      - name: Validate generated Ruby package definitions
        run: |
          ruby -c homebrew-tap/Formula/krater-pro.rb
          ruby -c homebrew-tap/Casks/krater-pro-app.rb
      - name: Commit dedicated version branch and open update PR
        shell: bash
        run: |
          BRANCH="krater-pro-v${{ needs.validate.outputs.version }}"
          git -C homebrew-tap config user.name "krater-pro-release[bot]"
          git -C homebrew-tap config user.email "krater-pro-release[bot]@users.noreply.github.com"
          git -C homebrew-tap switch -c "$BRANCH"
          git -C homebrew-tap add \
            Formula/krater-pro.rb \
            Casks/krater-pro-app.rb \
            ".krater-pro/release-${{ needs.validate.outputs.version }}.json"
          git -C homebrew-tap commit -m "krater-pro ${{ needs.validate.outputs.version }}"
          gh auth setup-git
          git -C homebrew-tap push --set-upstream origin "$BRANCH"
          gh pr create \
            --repo "$TAP_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "krater-pro ${{ needs.validate.outputs.version }}" \
            --body-file homebrew-tap/.krater-pro/pr-body.md
