name: Verified checkpoint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verified-checkpoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_VERSION: 11.16.0
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  validate:
    name: Test source, proof, packaging, and cloud
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Pin npm used by locked release inputs
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - run: npm ci
      - run: npm run guard:secrets
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --testTimeout=120000 --hookTimeout=30000
      - run: npm run desktop:test
      - run: npm run cloud:test
      - run: npm run benchmark:validate
      - run: npm run benchmark:evidence:validate
      - run: npm run benchmark:evidence:smoke
      - run: npm run release:test
      - run: npm pack --dry-run

  native-boundary:
    name: Command boundary (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-15
            platform: mac
          - label: Linux
            os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Pin npm used by locked release inputs
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - run: npm ci
      - run: npm run build
      - name: Exercise supported-platform command and credential boundaries
        run: >-
          npm test --
          src/command-gate.test.ts
          src/credential-store.test.ts
          src/credential-store.launch.test.ts
          src/workspace.command-security.test.ts
          desktop/tests/command-gate-parent.test.mjs
          --testTimeout=20000
      - name: Exercise the built workspace command boundary
        run: node scripts/release/smoke-workspace-command.mjs
      - name: Install Linux launch-smoke display
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Launch source Electron on macOS
        if: matrix.platform == 'mac'
        env:
          KRATER_API_KEY: ""
          KRATER_DESKTOP_WORKSPACE: ${{ runner.temp }}/krater-pro-native-smoke
        run: |
          node -e "require('node:fs').mkdirSync(process.env.KRATER_DESKTOP_WORKSPACE, { recursive: true })"
          npm run desktop:start -- --krater-smoke-test
      - name: Launch source Electron on Linux
        if: matrix.platform == 'linux'
        env:
          KRATER_API_KEY: ""
          KRATER_DESKTOP_WORKSPACE: ${{ runner.temp }}/krater-pro-native-smoke
        run: |
          node -e "require('node:fs').mkdirSync(process.env.KRATER_DESKTOP_WORKSPACE, { recursive: true })"
          xvfb-run -a npm run desktop:start -- --krater-smoke-test
