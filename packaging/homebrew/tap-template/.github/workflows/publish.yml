name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Reviewed pull request number
        required: true
      head_sha:
        description: Exact reviewed pull request head commit SHA
        required: true

permissions:
  contents: read

jobs:
  pr-pull:
    name: Publish reviewed bottles
    runs-on: ubuntu-latest
    environment: bottle-publication
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      packages: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up reviewed bot identity
        uses: Homebrew/actions/git-user-config@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - name: Pull and publish only the reviewed bottle subjects
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: >-
          brew pr-pull --debug
          --tap="$GITHUB_REPOSITORY"
          --head-sha="$HEAD_SHA"
          "$PULL_REQUEST"
      - name: Push bottle commit to main
        uses: Homebrew/actions/git-try-push@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          branch: main
