name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula-bottles:
    name: Formula and bottle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - macos-26
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect a staged CLI formula
        id: package
        shell: bash
        run: |
          if [[ -f Formula/krater-pro.rb ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-
      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax
      - name: Encode short-lived workflow token for bottle build
        id: bottle-token
        if: github.event_name == 'pull_request' && steps.package.outputs.present == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          encoded="$(printf '%s' "$TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$encoded"
          echo "token=$encoded" >> "$GITHUB_OUTPUT"
      - name: Build formula, run tests, and produce bottle
        if: github.event_name == 'pull_request' && steps.package.outputs.present == 'true'
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.bottle-token.outputs.token }}
        run: >-
          brew test-bot --only-formulae
          --root-url=https://ghcr.io/v2/supratimsircar05/tap
      - name: Upload bottles for reviewed publication
        if: always() && github.event_name == 'pull_request' && steps.package.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
          if-no-files-found: error

  formula-bottles-linux:
    name: Formula and bottle (Linux x64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main@sha256:a1c2696026eb2dccd5faba8d0ab5cb6f9bb2fcde59704a37cbfeb45a6a0e5f2a
      options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect a staged CLI formula
        id: package
        shell: bash
        run: |
          if [[ -f Formula/krater-pro.rb ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: linux-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: linux-rubygems-
      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax
      - name: Encode short-lived workflow token for bottle build
        id: bottle-token
        if: github.event_name == 'pull_request' && steps.package.outputs.present == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          encoded="$(printf '%s' "$TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$encoded"
          echo "token=$encoded" >> "$GITHUB_OUTPUT"
      - name: Build formula, run tests, and produce bottle
        if: github.event_name == 'pull_request' && steps.package.outputs.present == 'true'
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.bottle-token.outputs.token }}
        run: >-
          brew test-bot --only-formulae
          --root-url=https://ghcr.io/v2/supratimsircar05/tap
      - name: Upload bottle for reviewed publication
        if: always() && github.event_name == 'pull_request' && steps.package.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bottles_ubuntu-latest
          path: "*.bottle.*"
          if-no-files-found: error

  cask:
    name: Cask (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Detect a staged desktop cask
        id: package
        shell: bash
        run: |
          if [[ -f Casks/krater-pro-app.rb ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Audit and install cask
        if: steps.package.outputs.present == 'true'
        run: |
          brew audit --cask --strict Casks/krater-pro-app.rb
          brew install --cask ./Casks/krater-pro-app.rb
      - name: Verify notarization, renderer launch, and uninstall
        if: steps.package.outputs.present == 'true'
        run: |
          codesign --verify --deep --strict "/Applications/Krater Pro.app"
          spctl --assess --type execute --verbose=2 "/Applications/Krater Pro.app"
          "/Applications/Krater Pro.app/Contents/MacOS/Krater Pro" --krater-smoke-test
          brew uninstall --cask krater-pro-app
